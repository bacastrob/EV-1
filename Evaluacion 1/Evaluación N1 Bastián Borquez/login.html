<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SemiCel · Iniciar sesión</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="text-white py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h3 m-0">SemiCel</h1>
      <p class="m-0 small">Celulares seminuevos revisados y con garantía</p>
    </div>
  </header>

  <nav class="navbar bg-body-tertiary border-bottom">
    <div class="container">
      <a class="nav-link" href="index.html">← Volver a la tienda</a>
    </div>
  </nav>

  <!-- formulario de inicio de sesión -->
  <main class="container my-5">
    <section class="mx-auto" style="max-width: 400px;">
      <h2 class="h4 mb-4 text-center">Iniciar sesión</h2>

      <form id="formLogin" novalidate>

        <div class="mb-3">
          <label for="correo" class="form-label">Correo</label>
          <input type="email" id="correo" class="form-control" placeholder="nombre@correo.cl">
          <!-- si el correo está vacío o mal escrito -->
          <div class="invalid-feedback" id="errorCorreo"></div>
        </div>

        <div class="mb-3">
          <label for="clave" class="form-label">Contraseña</label>
          <input type="password" id="clave" class="form-control">
          <div class="invalid-feedback" id="errorClave"></div>
        </div>

        <!-- Mensaje de error login -->
        <div class="alert alert-danger d-none" id="errorLogin"></div>

        <button type="submit" class="btn btn-semicel w-100">Iniciar sesión</button>
      </form>
    </section>
  </main>

  <footer id="contacto" class="text-white py-3 mt-4">
    <div class="container text-center small">
      <p class="m-0">SemiCel · Celulares Seminuevos</p>
      <p class="m-0">Dirección: Av. Principal 123, Santiago</p>
      <p class="m-0">Teléfono: (56) 9 1234 5678</p>
      <p class="m-0">contacto@semicel.cl</p>
    </div>
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
