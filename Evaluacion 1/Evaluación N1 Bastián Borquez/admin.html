<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SemiCel · Administración</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="text-white py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h3 m-0">SemiCel</h1>
      <p class="m-0 small">Panel de administración</p>
    </div>
  </header>

  <nav class="navbar bg-body-tertiary border-bottom">
    <div class="container">
      <a class="nav-link" href="index.html">Ver tienda</a>
      <a class="btn btn-outline-secondary btn-sm" href="login.html">Cerrar sesión</a>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row">

      
      <aside class="col-lg-4 mb-4">
        <h2 class="h5" id="tituloFormulario">Agregar producto</h2>

        <form id="formProducto" novalidate>
          <input type="hidden" id="productoId">

          <div class="mb-3">
            <label for="marca" class="form-label">Marca</label>
            <select id="marca" class="form-select">
              <option value="">Elige una marca</option>
              <option value="Apple">Apple</option>
              <option value="Samsung">Samsung</option>
              <option value="Xiaomi">Xiaomi</option>
              <option value="Motorola">Motorola</option>
            </select>
            <div class="invalid-feedback" id="errorMarca"></div>
          </div>

          <div class="mb-3">
            <label for="modelo" class="form-label">Modelo</label>
            <input type="text" id="modelo" class="form-control" placeholder="Ej: iPhone 12 128 GB">
            <div class="invalid-feedback" id="errorModelo"></div>
          </div>

          <div class="mb-3">
            <label for="imagen" class="form-label">Imagen (ruta del archivo)</label>
            <input type="text" id="imagen" class="form-control" placeholder="img/iphone12.jpg">
            <div class="invalid-feedback" id="errorImagen"></div>
          </div>


          <div class="mb-3">
            <label for="pantalla" class="form-label">Pantalla</label>
            <input type="text" id="pantalla" class="form-control" placeholder="Ej: 6.1 pulgadas">
            <div class="invalid-feedback" id="errorPantalla"></div>
          </div>

          <div class="mb-3">
            <label for="procesador" class="form-label">Procesador</label>
            <input type="text" id="procesador" class="form-control" placeholder="Ej: A14 Bionic">
            <div class="invalid-feedback" id="errorProcesador"></div>
          </div>

          <div class="mb-3">
            <label for="camara" class="form-label">Cámara</label>
            <input type="text" id="camara" class="form-control" placeholder="Ej: 12 MP">
            <div class="invalid-feedback" id="errorCamara"></div>
          </div>

          <div class="mb-3">
            <label for="memoria" class="form-label">Memoria</label>
            <input type="text" id="memoria" class="form-control" placeholder="Ej: 128 GB">
            <div class="invalid-feedback" id="errorMemoria"></div>
          </div>

          <div class="mb-3">
            <label for="ram" class="form-label">RAM</label>
            <input type="text" id="ram" class="form-control" placeholder="Ej: 4 GB">
            <div class="invalid-feedback" id="errorRam"></div>
          </div>

          <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input type="number" id="precio" class="form-control" placeholder="Ej: 250000">
            <div class="invalid-feedback" id="errorPrecio"></div>
          </div>



          

          <button type="submit" class="btn btn-semicel w-100" id="botonGuardar">Agregar producto</button>
          <!-- solo aparece mientras se edita -->
          <button type="button" class="btn btn-link w-100 d-none" id="botonCancelar">Cancelar edición</button>
        </form>
      </aside>

      <!-- tabla con todos los productos -->
      <section class="col-lg-8">
        <h2 class="h5">Productos</h2>
        <div class="alert d-none" id="mensajeadmin" role="alert"></div>

        <!-- tabla responsiva -->
        <div class="table-responsive">
          <table class="table table-hover align-middle bg-white">
            <thead>
              <tr>
                <th>Foto</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Pantalla</th>
                <th>Procesador</th>
                <th>Camara</th>
                <th>Memoria</th>
                <th>Ram</th>
                <th>Precio</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaProductos"></tbody>
          </table>
        </div>
      </section>

    </div>
  </main>

  <footer id="contacto" class="text-white py-3 mt-4">
    <div class="container text-center small">
      <p class="m-0">SemiCel · Celulares Seminuevos</p>
      <p class="m-0">Dirección: Av. Principal 123, Santiago</p>
      <p class="m-0">Teléfono: (56) 9 1234 5678</p>
      <p class="m-0">contacto@semicel.cl</p>
    </div>
  </footer>

  <script src="js/productos.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
